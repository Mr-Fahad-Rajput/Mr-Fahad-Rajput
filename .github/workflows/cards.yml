name: Profile cards

on:
  schedule:
    - cron: "17 1 * * *"   # daily, 06:17 Pakistan time
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/cards.yml"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install "pillow>=11,<12" "requests>=2.32,<3"

      - name: Render cards
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARDS_TOKEN: ${{ secrets.CARDS_TOKEN }}
        run: python scripts/cards.py

      - name: Commit changed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards
          if git diff --cached --quiet; then
            echo "No card changes."
          else
            git commit -m "Update profile cards"
            git push
          fi
